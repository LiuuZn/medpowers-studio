[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medpowers-studio-backend"
version = "0.16.0"
description = "MedPowers Studio — 医疗影像数据管标训评一体化平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9,<1",
    "PyJWT>=2.9,<3",
    "bcrypt>=4.2,<5",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "SimpleITK>=2.3,<3",
    "pydicom>=3.0,<4",
    "Pillow>=10.0,<12",
    "pyarrow>=17,<22",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
